# Load balancer in front of two Pulse instances. `ip_hash` keeps a client on one instance,
# which the HTTP long-polling fallback needs (a WebSocket-only client would not).
upstream pulse {
    ip_hash;
    server chat-1:3000;
    server chat-2:3000;
}

server {
    listen 80;

    location / {
        proxy_pass http://pulse;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }
}
